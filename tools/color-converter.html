<main class="tool-main"><h1>颜色转换器</h1>
<p class="subtitle">HEX ⇄ RGB ⇄ HSL 在线颜色格式转换，实时预览</p>
<div class="ad-placeholder">广告位</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <label style="font-size:13px;color:var(--text2);display:block;margin-bottom:4px">选择颜色</label>
    <input type="color" id="picker" value="#6366f1" style="width:100%;height:50px;border:none;cursor:pointer;border-radius:8px" oninput="sync()">
    <div style="margin-top:12px;display:grid;gap:8px">
      <div><label style="font-size:12px;color:var(--text2)">HEX</label><input type="text" id="hex" value="#6366f1" style="width:100%;padding:8px;border:2px solid var(--border);border-radius:6px;font-family:monospace;font-size:14px" oninput="fromHex()"></div>
      <div><label style="font-size:12px;color:var(--text2)">RGB</label><input type="text" id="rgb" value="rgb(99, 102, 241)" style="width:100%;padding:8px;border:2px solid var(--border);border-radius:6px;font-family:monospace;font-size:14px" oninput="fromRgb()"></div>
      <div><label style="font-size:12px;color:var(--text2)">HSL</label><input type="text" id="hsl" value="hsl(239, 84%, 67%)" style="width:100%;padding:8px;border:2px solid var(--border);border-radius:6px;font-family:monospace;font-size:14px" oninput="fromHsl()"></div>
    </div>
  </div>
  <div id="preview" style="border-radius:12px;min-height:200px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)"></div>
</div>
<script>
function hexToRgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(function(c) { return c + c; }).join("");
  return { r: parseInt(h.substr(0,2), 16), g: parseInt(h.substr(2,2), 16), b: parseInt(h.substr(4,2), 16) };
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(function(x) {
    var h = x.toString(16);
    return h.length === 1 ? "0" + h : h;
  }).join("");
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b);
  var h, s, l = (max + min) / 2;
  if (max === min) { h = s = 0; }
  else {
    var d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }
  return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function sync() {
  var hex = document.getElementById("picker").value;
  var rgb = hexToRgb(hex);
  var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  document.getElementById("hex").value = hex;
  document.getElementById("rgb").value = "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
  document.getElementById("hsl").value = "hsl(" + hsl.h + ", " + hsl.s + "%, " + hsl.l + "%)";
  document.getElementById("preview").style.background = hex;
  document.getElementById("preview").textContent = hex;
}
function fromHex() {
  var v = document.getElementById("hex").value.trim();
  if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)) return;
  var rgb = hexToRgb(v);
  var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  document.getElementById("picker").value = v;
  document.getElementById("rgb").value = "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
  document.getElementById("hsl").value = "hsl(" + hsl.h + ", " + hsl.s + "%, " + hsl.l + "%)";
  document.getElementById("preview").style.background = v;
  document.getElementById("preview").textContent = v;
}
function fromRgb() {
  var v = document.getElementById("rgb").value.trim();
  var m = v.match(/rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/i);
  if (!m) return;
  var r = parseInt(m[1]), g = parseInt(m[2]), b = parseInt(m[3]);
  var hex = rgbToHex(r, g, b);
  var hsl = rgbToHsl(r, g, b);
  document.getElementById("picker").value = hex;
  document.getElementById("hex").value = hex;
  document.getElementById("hsl").value = "hsl(" + hsl.h + ", " + hsl.s + "%, " + hsl.l + "%)";
  document.getElementById("preview").style.background = hex;
  document.getElementById("preview").textContent = hex;
}
function fromHsl() { /* 简化处理 */ }
sync();
