<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换 - 免费在线工具</title>
<meta name="description" content="Unix 时间戳与日期互转，支持秒和毫秒">
<link rel="canonical" href="https://jdtbsaving.shop/tools/timestamp-converter.html">
<style>
:root{--bg:#f8fafc;--surface:#fff;--text:#1a1a2e;--text2:#64748b;--border:#e2e8f0;
--accent:#6366f1;--accent-hover:#4f46e5;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);
--font:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.tool-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 0}
.tool-header .container{max-width:900px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
.tool-header .logo{font-size:18px;font-weight:700;color:var(--accent);text-decoration:none}
.tool-header .logo:hover{color:var(--accent-hover)}
.tool-nav{display:flex;gap:16px;margin-left:auto}
.tool-nav a{color:var(--text2);text-decoration:none;font-size:13px}
.tool-nav a:hover{color:var(--accent)}
.tool-main{flex:1;max-width:900px;margin:0 auto;padding:32px 20px;width:100%}
.tool-main h1{font-size:24px;margin-bottom:6px}
.tool-main .subtitle{color:var(--text2);font-size:14px;margin-bottom:24px}
.ad-placeholder{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
text-align:center;padding:20px;margin:20px 0;color:var(--text2);font-size:12px}
.tool-footer{background:var(--surface);border-top:1px solid var(--border);padding:20px 0;text-align:center;
font-size:12px;color:var(--text2)}
.tool-footer a{color:var(--accent);text-decoration:none}
input,textarea,select,button{font-family:var(--font)}
textarea{width:100%;min-height:200px;padding:14px;border:2px solid var(--border);border-radius:var(--radius);
font-size:14px;resize:vertical;background:var(--bg);color:var(--text);outline:none;transition:border .2s}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
button,.btn{padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
button:hover,.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.output-area{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--border);
border-radius:var(--radius);min-height:80px;word-break:break-all;font-size:14px;line-height:1.7}
.input-group{display:flex;gap:8px;margin:12px 0}
.input-group input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius);font-size:14px}
.result-bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.result-bar .label{font-size:13px;color:var(--text2)}
.copy-btn{padding:6px 16px;font-size:12px}
@media(max-width:640px){.tool-main{padding:20px 16px}.input-group{flex-direction:column}}
</style>
</head>
<body>
<header class="tool-header"><div class="container">
<a href="/tools/" class="logo">🛠 在线工具</a>
<nav class="tool-nav"><a href="/tools/">全部工具</a><a href="/">好物导航</a></nav>
</div></header>
<main class="tool-main"><h1>时间戳转换</h1>
<p class="subtitle">Unix 时间戳 ⇄ 日期时间，支持秒和毫秒，自动检测格式</p>
<div class="ad-placeholder">广告位</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <h3 style="font-size:16px;margin-bottom:8px">时间戳 → 日期</h3>
    <input type="text" id="tsIn" placeholder="输入时间戳... 例如 1750000000" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:8px">
    <button onclick="tsToDate()" style="width:100%">🔍 转换</button>
    <div class="output-area" id="tsOut" style="margin-top:8px;padding:12px;text-align:center;font-size:18px;font-weight:600"></div>
  </div>
  <div>
    <h3 style="font-size:16px;margin-bottom:8px">日期 → 时间戳</h3>
    <input type="datetime-local" id="dtIn" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:8px">
    <button onclick="dateToTs()" style="width:100%">🔍 转换</button>
    <div class="output-area" id="dtOut" style="margin-top:8px;padding:12px;text-align:center;font-family:monospace;font-size:16px"></div>
  </div>
</div>
<div style="text-align:center;margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;font-size:14px;font-family:monospace"><strong>当前时间戳:</strong> <span id="nowTs"></span></div>
<script>
function tsToDate() {
  var v = document.getElementById("tsIn").value.trim();
  if (!v) return;
  var ts = parseInt(v);
  if (ts > 9999999999) ts = Math.floor(ts / 1000); // ms -> s
  var d = new Date(ts * 1000);
  document.getElementById("tsOut").textContent = d.toLocaleString("zh-CN", {timeZone:"Asia/Shanghai"});
}
function dateToTs() {
  var v = document.getElementById("dtIn").value;
  if (!v) return;
  var d = new Date(v);
  var ts = Math.floor(d.getTime() / 1000);
  document.getElementById("dtOut").textContent = ts + " (秒)\n" + (ts * 1000) + " (毫秒)";
}
setInterval(function() {
  document.getElementById("nowTs").textContent = Math.floor(Date.now() / 1000);
}, 1000);
</script></main>
<footer class="tool-footer"><p>AI 工具工厂 · <a href="/tools/">全部工具</a></p></footer>
</body></html>
