<main class="tool-main"><h1>Markdown 预览</h1>
<p class="subtitle">在线 Markdown 编辑器，实时预览，支持 GitHub 风格</p>
<div class="ad-placeholder">广告位</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">✏️ 编辑器</h3>
    <textarea id="mdInput" placeholder="# 标题\n\n**加粗** *斜体*\n\n- 列表项 1\n- 列表项 2\n\n[链接](https://example.com)\n\n> 引用文字" style="min-height:400px;font-family:monospace" oninput="preview()"># 欢迎使用 Markdown 预览\n\n这是一个 **在线 Markdown 编辑器**。\n\n## 功能\n\n- 实时预览\n- GitHub 风格\n- 支持代码高亮\n\n### 代码示例\n\n```javascript\nconsole.log("Hello World");\n```\n\n> Markdown 让写作更专注</textarea>
  </div>
  <div>
    <h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">👁️ 预览</h3>
    <div id="preview" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;min-height:400px;overflow-y:auto;line-height:1.7"></div>
  </div>
</div>
<style>#preview h1{font-size:1.8em;border-bottom:2px solid var(--border);padding-bottom:8px;margin-bottom:12px}#preview h2{font-size:1.4em;margin-top:20px;margin-bottom:8px}#preview h3{font-size:1.1em;margin-top:16px}#preview ul,#preview ol{padding-left:20px}#preview li{margin:4px 0}#preview code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:13px}#preview pre{background:var(--bg);padding:16px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5}#preview pre code{background:none;padding:0}#preview blockquote{border-left:4px solid var(--accent);padding:8px 16px;color:var(--text2);background:var(--bg);margin:12px 0;border-radius:0 8px 8px 0}#preview a{color:var(--accent)}#preview table{border-collapse:collapse;width:100%}#preview th,#preview td{border:1px solid var(--border);padding:8px 12px;text-align:left}#preview th{background:var(--bg);font-weight:600}#preview img{max-width:100%}</style>
<script>
function preview() {
  var md = document.getElementById("mdInput").value;
  document.getElementById("preview").innerHTML = parseMarkdown(md);
}
function parseMarkdown(md) {
  var html = md;
  // Escape HTML
  html = html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Code blocks (multi-line)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    return "<pre><code>" + code.trim() + "</code></pre>";
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  // Bold & Italic
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
  // Images
  html = html.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">');
  // Links
  html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');
  // Headers
  html = html.replace(/^#### (.+)/gm, "<h4>$1</h4>");
  html = html.replace(/^### (.+)/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)/gm, "<h1>$1</h1>");
  // Blockquote
  html = html.replace(/^> (.+)/gm, "<blockquote>$1</blockquote>");
  // Horizontal rule
  html = html.replace(/^---$/gm, "<hr>");
  // Unordered lists
  html = html.replace(/^- (.+)/gm, "<li>$1</li>");
  html = html.replace(/(<li>.*<\/li>)\n(?=<li>)/g, "$1");
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, "<ul>$1</ul>");
  // Ordered lists
  html = html.replace(/^\d+\. (.+)/gm, "<li>$1</li>");
  // Paragraphs
  html = html.replace(/\n\n/g, "</p><p>");
  html = "<p>" + html + "</p>";
  // Clean up empty paragraphs
  html = html.replace(/<p><\/p>/g, "");
  html = html.replace(/<p>(<h[1-4])/g, "$1");
  html = html.replace(/(<\/h[1-4]>)<\/p>/g, "$1");
  return html;
}
preview();
</script></main>
